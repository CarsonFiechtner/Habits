name: Release

# Push a tag like v0.1.0 to publish a signed APK as a GitHub Release.
# Obtainium watches these releases and installs updates on the phone.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEEPUP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret KEEPUP_KEYSTORE_BASE64 is missing. See README > Releases."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keepup-release.p12"
          echo "KEEPUP_KEYSTORE_PATH=$RUNNER_TEMP/keepup-release.p12" >> "$GITHUB_ENV"

      - name: Test and build signed release APK
        env:
          VERSION_NAME: ${{ github.ref_name }}
          KEEPUP_KEYSTORE_PASSWORD: ${{ secrets.KEEPUP_KEYSTORE_PASSWORD }}
          KEEPUP_KEY_ALIAS: ${{ secrets.KEEPUP_KEY_ALIAS }}
          KEEPUP_KEY_PASSWORD: ${{ secrets.KEEPUP_KEY_PASSWORD }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          ./gradlew test assembleRelease --console=plain

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "keepup-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: keepup-${{ github.ref_name }}.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/keepup-release.p12"
