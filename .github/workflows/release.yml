name: Release

# Publishes a signed APK as a GitHub Release; Obtainium watches these releases and installs updates.
# Two ways to start it:
#  - push a tag like v0.1.0, or
#  - run it manually (Actions > Release > Run workflow) with a version like 0.1.0;
#    the workflow then creates the v0.1.0 tag on the selected commit itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - name: Validate version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag like v1.2.3 or v1.2.3-beta1"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEEPUP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret KEEPUP_KEYSTORE_BASE64 is missing. See README > Releases."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keepup-release.p12"
          echo "KEEPUP_KEYSTORE_PATH=$RUNNER_TEMP/keepup-release.p12" >> "$GITHUB_ENV"

      - name: Test and build signed release APK
        env:
          KEEPUP_KEYSTORE_PASSWORD: ${{ secrets.KEEPUP_KEYSTORE_PASSWORD }}
          KEEPUP_KEY_ALIAS: ${{ secrets.KEEPUP_KEY_ALIAS }}
          KEEPUP_KEY_PASSWORD: ${{ secrets.KEEPUP_KEY_PASSWORD }}
        run: |
          export VERSION_NAME="${TAG#v}"
          ./gradlew test assembleRelease --console=plain

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "keepup-${TAG}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: keepup-${{ env.TAG }}.apk
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG, '-') }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/keepup-release.p12"
